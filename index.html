  /* ---------- AI Analyst (in-browser LLM, same design as the Assurance tracker) ----------
     • Runs on the user's machine with WebLLM + WebGPU. Data never leaves the browser;
       only the model weights are downloaded once and cached.
     • Every number is computed by the dashboard (setFacts in each page). The model only
       interprets those facts and is told not to calculate or invent figures. */
  const WEBLLM_URL = 'https://esm.run/@mlc-ai/web-llm@0.2.87';
  const AI_MODELS = {
    tiny: { label: 'Tiny — Qwen2.5 0.5B (~400 MB, quick test)', f16: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', f32: 'Qwen2.5-0.5B-Instruct-q4f32_1-MLC' },
    fast: { label: 'Fast — Qwen2.5 1.5B (~1 GB)', f16: 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC', f32: 'Qwen2.5-1.5B-Instruct-q4f32_1-MLC' },
    quality: { label: 'Better — Qwen2.5 3B (~2 GB)', f16: 'Qwen2.5-3B-Instruct-q4f16_1-MLC', f32: 'Qwen2.5-3B-Instruct-q4f32_1-MLC' }
  };
  const AI_LANGS = { en: 'English', ar: 'Arabic', fr: 'French' };
  const AI = { webllm: null, engine: null, loaded: null, busy: false, open: false, model: 'fast', lang: 'en', inPpt: true, results: {}, facts: null, status: '' };
  const R0 = (v) => (v == null || !isFinite(v) ? null : Math.round(v));
  const P0 = (v) => (v == null || !isFinite(v) ? null : Math.round(v * 100));
  function setFacts(f) {
    const pg = PAGES.find(p => p.id === S.page);
    const facts = { page: pg ? pg.title : S.page, period: rangeLabel(), branchFilter: S.branch, segmentFilter: S.segment, ...f };
    // Keep the prompt small enough for small models: trim the longest lists first.
    let json = JSON.stringify(facts);
    for (let guard = 0; json.length > 9000 && guard < 40; guard++) {
      let key = null, len = 0;
      const walk = (o) => Object.values(o).forEach(v => { if (Array.isArray(v) && v.length > 3 && v.length > len) { len = v.length; key = v; } else if (v && typeof v === 'object' && !Array.isArray(v)) walk(v); });
      walk(facts); if (!key) break; key.splice(Math.ceil(key.length * 0.7));
      json = JSON.stringify(facts);
    }
    AI.facts = facts;
  }
  const aiSig = () => S.page + '|' + scopeLabel() + '|' + JSON.stringify(S.p);
  function aiSystemPrompt(lang) {
    return [
      'You are an internal business performance analyst for Alborg Scan, a radiology network in Egypt (part of IDH, Integrated Diagnostics Holdings).',
      'You receive a JSON of pre-computed facts for one page of the monthly business review dashboard.',
      'STRICT RULES:',
      '- Use ONLY numbers that appear in the JSON. Never calculate, estimate or invent figures, names or dates.',
      '- If something is not in the data, say it is not available.',
      '- Fields ending in Pct are percentages; null means not measurable (e.g. no target or no last-year base).',
      '- Target achievement: >=100% on target, 85-99% near target, <85% below target. Utilization >=90% means capacity constrained.',
      '- Walk-in = self-paying patients; Corporate = insurers and contracted customers. Revenue is in EGP.',
      '- Be concise and specific. Name the branch, modality, rep or customer behind each point.',
      `- Write the whole answer in ${AI_LANGS[lang] || 'English'}.`
    ].join('\n');
  }
  const aiAnalysisPrompt = (facts) => [
    'Analyse these dashboard facts and answer with exactly these sections using markdown headings (##):',
    '## Overall picture — 2-3 sentences on performance vs target and vs last year.',
    '## Main gaps — up to 5 bullets: where the shortfall is and why it matters (cite their numbers).',
    '## Bright spots — up to 3 bullets.',
    '## Recommended actions — up to 5 prioritised bullets, each starting with an owner (branch manager, sales/medical reps, corporate team, operations).',
    '## Data caveats — only if the facts show gaps (nulls, missing targets, notes).',
    '', 'FACTS:', JSON.stringify(facts)
  ].join('\n');
  function aiRenderMd(md) {
    const lines = esc(md).split('\n'); let html = '', inList = false;
    for (const raw of lines) {
      const line = raw.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      const h = line.match(/^#{1,4}\s+(.*)/), li = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
      if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${li[1]}</li>`; continue; }
      if (inList) { html += '</ul>'; inList = false; }
      if (h) html += `<h4>${h[1]}</h4>`; else if (line.trim()) html += `<p>${line}</p>`;
    }
    return html + (inList ? '</ul>' : '');
  }
  async function aiPickModel(choice) {
    if (!('gpu' in navigator)) throw new Error('NO_WEBGPU');
    const adapter = await navigator.gpu.requestAdapter(); if (!adapter) throw new Error('NO_WEBGPU');
    const m = AI_MODELS[choice] || AI_MODELS.fast; return adapter.features.has('shader-f16') ? m.f16 : m.f32;
  }
  async function aiEngine(choice, onProgress) {
    const id = await aiPickModel(choice);
    if (AI.engine && AI.loaded === id) return AI.engine;
    AI.webllm = AI.webllm || await import(WEBLLM_URL);
    if (AI.engine) { await AI.engine.unload(); AI.engine = null; AI.loaded = null; }
    AI.engine = await AI.webllm.CreateMLCEngine(id, { initProgressCallback: onProgress });
    AI.loaded = id; return AI.engine;
  }
  function aiPaint() {
    const out = document.getElementById('aiOutput'); if (!out) return;
    const r = AI.results[S.page];
    if (AI.busy && AI.status) { out.innerHTML = AI.status + (r && r.text ? aiRenderMd(r.text) : ''); return; }
    if (r && r.text) {
      out.innerHTML = (r.sig !== aiSig() ? '<p class="ai-warn">⚠ Filters changed since this was generated. Re-run to match the current view.</p>' : '') + aiRenderMd(r.text);
    } else out.innerHTML = '<p class="muted">First run downloads the model once (about 1–2 GB) and caches it. Needs a recent Chrome or Edge with WebGPU. Numbers come from this page and its filters; the AI only interprets them, so verify before acting.</p>';
    const cp = document.getElementById('aiCopy'); if (cp) cp.hidden = !(r && r.text) || AI.busy;
  }
  function aiSetBusy(on) {
    AI.busy = on;
    ['aiAnalyze', 'aiAsk'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = on; });
    const st = document.getElementById('aiStop'); if (st) st.hidden = !on;
  }
  async function aiRun(prompt, title) {
    if (AI.busy || !AI.facts) return;
    const page = S.page, facts = AI.facts, sig = aiSig();
    AI.results[page] = { text: '', title, sig, at: '', model: '' };
    aiSetBusy(true);
    const t0 = Date.now(); let lastP = -1, lastText = '', lastChange = Date.now();
    const mmss = (ms) => { const x = Math.floor(ms / 1000); return `${Math.floor(x / 60)}:${String(x % 60).padStart(2, '0')}`; };
    const paintLoad = () => {
      const cached = /Loading model from cache/i.test(lastText), stalled = Date.now() - lastChange > 300000;
      AI.status = `<p><strong>${cached ? 'Loading model from cache' : 'Downloading model (first time only)'}: ${lastP < 0 ? 'starting' : Math.round(lastP * 100) + '%'}</strong> · elapsed ${mmss(Date.now() - t0)}</p><p class="muted">${esc(lastText || 'Preparing…')}</p>`
        + (cached ? '' : '<p class="muted">Progress updates after each ~32 MB chunk. Keep this tab open; next time it loads from cache in seconds.</p>')
        + (stalled ? '<p class="ai-error">No new chunk for 5 minutes. The network may be blocking huggingface.co (company firewall / VPN). Try another network, or press Stop and pick the Tiny model.</p>' : '');
      aiPaint();
    };
    const timer = setInterval(paintLoad, 1000); paintLoad();
    try {
      const eng = await aiEngine(AI.model, (r) => { if (r.progress !== lastP || r.text !== lastText) lastChange = Date.now(); lastP = r.progress; lastText = r.text; paintLoad(); });
      clearInterval(timer);
      AI.status = '<p class="muted">Analysing…</p>'; aiPaint(); AI.status = '';
      const stream = await eng.chat.completions.create({ stream: true, temperature: 0.2, max_tokens: 900, messages: [{ role: 'system', content: aiSystemPrompt(AI.lang) }, { role: 'user', content: prompt(facts) }] });
      for await (const chunk of stream) { AI.results[page].text += chunk.choices[0]?.delta?.content || ''; if (S.page === page) aiPaint(); }
      Object.assign(AI.results[page], { at: new Date().toLocaleString(), model: AI.loaded.replace(/-MLC$/, ''), filters: scopeLabel() });
    } catch (e) {
      clearInterval(timer);
      if (!/abort|interrupt/i.test(String(e && e.message))) {
        AI.results[page].text = '';
        const msg = e && e.message === 'NO_WEBGPU' ? "This browser can't run the AI: WebGPU is not available. Use the latest Chrome or Edge on a PC with a GPU (and turn on hardware acceleration)." : 'AI error: ' + (e && e.message || e);
        AI.status = ''; aiSetBusy(false); const out = document.getElementById('aiOutput'); if (out) out.innerHTML = `<p class="ai-error">${esc(msg)}</p>`; return;
      }
    } finally { AI.status = ''; aiSetBusy(false); }
    aiPaint();
  }
  function mountAI(main) {
    const anchor = $('.page-head', main); if (!anchor) return;
    anchor.insertAdjacentHTML('afterend', `
      <details class="ai-card" id="aiCard"${AI.open ? ' open' : ''}>
        <summary><span class="ai-title">🤖 AI Analyst <span class="ai-badge">Runs in your browser · data stays on this PC</span></span>
          <span class="ai-sub">Explains this page with the current filters: gaps, bright spots and recommended actions.</span></summary>
        <div class="ai-body">
          <div class="ai-controls">
            <label>Model <select id="aiModel">${Object.entries(AI_MODELS).map(([k, m]) => `<option value="${k}"${k === AI.model ? ' selected' : ''}>${m.label}</option>`).join('')}</select></label>
            <label>Language <select id="aiLang">${Object.entries(AI_LANGS).map(([k, l]) => `<option value="${k}"${k === AI.lang ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
            <button id="aiAnalyze" class="btn primary" type="button">Analyze this page</button>
            <button id="aiStop" class="btn" type="button" hidden>Stop</button>
            <span class="spacer"></span>
            <label class="ai-ppt-toggle" title="Adds each page's latest AI result as a slide after that page in the PowerPoint export"><input type="checkbox" id="aiInPpt"${AI.inPpt ? ' checked' : ''}> Include in PowerPoint</label>
            <button id="aiCopy" class="btn" type="button" hidden>Copy</button>
          </div>
          <div class="ai-ask"><input id="aiQuestion" type="text" dir="auto" placeholder="Ask about this page… e.g. Which branch should we focus on first and why?"><button id="aiAsk" class="btn" type="button">Ask</button></div>
          <div id="aiOutput" class="ai-output" dir="auto"></div>
          <details class="ai-facts"><summary>Facts sent to the AI</summary><pre id="aiFacts"></pre></details>
        </div>
      </details>`);
    const g = (id) => document.getElementById(id);
    g('aiCard').addEventListener('toggle', (e) => { AI.open = e.target.open; });
    g('aiFacts').textContent = JSON.stringify(AI.facts, null, 2);
    g('aiModel').onchange = (e) => { AI.model = e.target.value; };
    g('aiLang').onchange = (e) => { AI.lang = e.target.value; };
    g('aiInPpt').onchange = (e) => { AI.inPpt = e.target.checked; };
    g('aiAnalyze').onclick = () => aiRun(aiAnalysisPrompt, 'AI analysis');
    const ask = () => { const q = g('aiQuestion').value.trim(); if (!q) return g('aiQuestion').focus(); aiRun((f) => `Answer this question using only the FACTS. Question: ${q}\n\nFACTS:\n${JSON.stringify(f)}`, 'AI answer — ' + q); };
    g('aiAsk').onclick = ask; g('aiQuestion').onkeydown = (e) => { if (e.key === 'Enter') ask(); e.stopPropagation(); };
    g('aiStop').onclick = () => { try { AI.engine && AI.engine.interruptGenerate(); } catch (e) { } if (AI.busy && !AI.loaded) location.reload(); };
    g('aiCopy').onclick = async () => { try { await navigator.clipboard.writeText(AI.results[S.page].text); g('aiCopy').textContent = 'Copied ✓'; setTimeout(() => { const c = g('aiCopy'); if (c) c.textContent = 'Copy'; }, 1500); } catch (e) { } };
    aiSetBusy(AI.busy); aiPaint();
  }
  // Plain text runs for a PowerPoint text box from the AI markdown.
  function aiPptRuns(md, ink) {
    const runs = [];
    md.split('\n').forEach(raw => {
      const t = raw.replace(/\*\*(.+?)\*\*/g, '$1').trim(); if (!t) return;
      const h = t.match(/^#{1,4}\s+(.*)/), li = t.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
      if (h) runs.push({ text: h[1], options: { bold: true, color: 'B71C1C', fontSize: 14, breakLine: true, paraSpaceBefore: 6 } });
      else if (li) runs.push({ text: li[1], options: { bullet: true, color: ink, fontSize: 12, breakLine: true } });
      else runs.push({ text: t, options: { color: ink, fontSize: 12, breakLine: true } });
    });
    return runs;
  }

      Chart.defaults.animation = false;
      document.documentElement.setAttribute('data-theme', 'light');
      document.body.classList.add('exporting');
      scrollTo(0, 0);
      const pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_WIDE'; // 13.333 x 7.5 in
      pptx.title = 'Alborg Scan Business Review – ' + rangeLabel();
      const SW = 13.333, SH = 7.5, FH = SW * FOOTER_H / FOOTER_W, M = 0.3, TOP = 0.2;
      const bg = hex(css('--bg')), ink = hex(css('--text')), ink2 = hex(css('--text-2'));
      let no = 0;
      // Title slide
      const t0 = pptx.addSlide(); t0.background = { color: 'FFFFFF' };
      t0.addText('Alborg Scan Business Review', { x: M + 0.4, y: 2.2, w: SW - 2 * M - 0.8, h: 0.9, fontSize: 36, bold: true, color: 'B71C1C', fontFace: 'Arial' });
      t0.addText(scopeLabel(), { x: M + 0.4, y: 3.15, w: SW - 2 * M - 0.8, h: 0.5, fontSize: 18, color: ink2, fontFace: 'Arial' });
      t0.addText(PAGES.map((p, i) => `${i + 1}. ${p.title}`).join('\n'), { x: M + 0.4, y: 3.9, w: 6, h: 1.8, fontSize: 14, color: ink, fontFace: 'Arial', valign: 'top' });
      t0.addImage({ data: FOOTER_IMG, x: 0, y: SH - FH, w: SW, h: FH });
      for (let i = 0; i < PAGES.length; i++) {
        const pg = PAGES[i];
        toast(`Exporting ${i + 1}/${PAGES.length}: ${pg.title}…`);
        S.page = pg.id; render(); await wait(300);
        const main = $('#page'), mr = main.getBoundingClientRect(), scale = 2;
        const canvas = await html2canvas(main, { scale, backgroundColor: css('--bg'), logging: false });
        const blocks = Array.from(main.children).map(el => { const r = el.getBoundingClientRect(); return { t: r.top - mr.top, b: r.bottom - mr.top, head: el.classList.contains('section-title') }; }).filter(b => b.b > b.t);
        const areaW = SW - 2 * M, areaH = SH - FH - TOP - 0.45;
        const maxH = main.clientWidth * areaH / areaW * 1.45; // allow some shrink before starting a new slide
        const slices = []; let cur = [];
        blocks.forEach(b => {
          if (cur.length && b.b - cur[0].t > maxH) {
            const carry = cur[cur.length - 1].head ? [cur.pop()] : []; // keep a section heading with its content
            if (cur.length) slices.push([cur[0].t, cur[cur.length - 1].b]);
            cur = carry;
          }
          cur.push(b);
        });
        if (cur.length) slices.push([cur[0].t, cur[cur.length - 1].b]);
        slices.forEach(([a, b], k) => {
          const y0 = Math.max(0, a - 6), y1 = Math.min(canvas.height / scale, b + 6);
          const c = document.createElement('canvas'); c.width = canvas.width; c.height = Math.max(1, Math.round((y1 - y0) * scale));
          c.getContext('2d').drawImage(canvas, 0, Math.round(y0 * scale), canvas.width, c.height, 0, 0, c.width, c.height);
          const slide = pptx.addSlide(); slide.background = { color: bg }; no++;
          let top = TOP;
          if (k > 0) { slide.addText(`${i + 1}. ${pg.title} (${k + 1}/${slices.length})`, { x: M, y: 0.12, w: areaW, h: 0.35, fontSize: 14, bold: true, color: ink, fontFace: 'Arial' }); top = 0.5; }
          const h = SH - FH - top - 0.45, ratio = c.width / c.height;
          let w = areaW, ih = w / ratio; if (ih > h) { ih = h; w = ih * ratio; }
          slide.addImage({ data: c.toDataURL('image/png'), x: (SW - w) / 2, y: top, w, h: ih });
          slide.addImage({ data: FOOTER_IMG, x: 0, y: SH - FH, w: SW, h: FH });
          slide.addText(String(no + 1), { x: SW * 0.70, y: SH - FH - 0.4, w: 0.6, h: 0.35, fontSize: 14, color: ink, align: 'center', fontFace: 'Arial' });
        });
        const air = AI.results[pg.id];
        if (AI.inPpt && air && air.text && air.at) {
          const slide = pptx.addSlide(); slide.background = { color: 'FFFFFF' }; no++;
          slide.addText(`${i + 1}. ${pg.title}: AI Analyst notes`, { x: M, y: 0.15, w: SW - 2 * M, h: 0.45, fontSize: 18, bold: true, color: ink, fontFace: 'Arial' });
          slide.addText(`Generated in the browser (${air.model}) on ${air.at} · Filters: ${air.filters}${air.sig !== keep.sigs[pg.id] ? ' · ⚠ filters changed since generation' : ''} · Draft for review; figures come from the dashboard, verify before acting.`, { x: M, y: 0.62, w: SW - 2 * M, h: 0.4, fontSize: 9, color: ink2, fontFace: 'Arial' });
          slide.addText(aiPptRuns(air.text, ink), { x: M, y: 1.05, w: SW - 2 * M, h: SH - FH - 1.5, valign: 'top', fontFace: 'Arial', fit: 'shrink', rtlMode: AI.lang === 'ar' });
          slide.addImage({ data: FOOTER_IMG, x: 0, y: SH - FH, w: SW, h: FH });
          slide.addText(String(no + 1), { x: SW * 0.70, y: SH - FH - 0.4, w: 0.6, h: 0.35, fontSize: 14, color: ink, align: 'center', fontFace: 'Arial' });
        }
      }
      await pptx.writeFile({ fileName: `BG_Scan_Review_${S.from}${S.to !== S.from ? '_to_' + S.to : ''}.pptx` });
      toast('PowerPoint downloaded');
    } catch (e) {
      alert('PowerPoint export failed: ' + e.message + '\nYour network may be blocking these sites: cdn.jsdelivr.net, unpkg.com.');
    } finally {
      Chart.defaults.animation = keep.anim;
      if (keep.theme) document.documentElement.setAttribute('data-theme', keep.theme); else document.documentElement.removeAttribute('data-theme');
      document.body.classList.remove('exporting');
      S.page = keep.page; render(); scrollTo(0, keep.y); btn.disabled = false;
    }
  }

  /* ---------- Boot ---------- */
  S.page = (location.hash || '#overview').slice(1);
  bindGlobal(); renderNav(); tryDefault();
})();

</script>
